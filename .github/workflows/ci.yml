name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application documentation
        run: cmake -DLVGL_CODEX_ROOT="$GITHUB_WORKSPACE" -P cmake/ValidateAppDocs.cmake

  windows-simulator:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [device-dashboard, bluetooth-speaker]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
      - run: >-
          cmake -S . -B build/ci-windows-${{ matrix.app }} -G Ninja
          -DLVGL_APP=${{ matrix.app }} -DLVGL_TARGET=pc-sdl2 -DLVGL_SERIES=9
      - run: cmake --build build/ci-windows-${{ matrix.app }}
      - run: ctest --test-dir build/ci-windows-${{ matrix.app }} --output-on-failure

  linux-fbdev-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [device-dashboard, bluetooth-speaker]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build
      - run: >-
          cmake -S . -B build/ci-linux-${{ matrix.app }} -G Ninja
          -DLVGL_APP=${{ matrix.app }} -DLVGL_TARGET=linux-fbdev-evdev -DLVGL_SERIES=9
      - run: cmake --build build/ci-linux-${{ matrix.app }}
      - run: ctest --test-dir build/ci-linux-${{ matrix.app }} --output-on-failure
