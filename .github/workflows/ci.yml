name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-simulator:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
      - run: >-
          cmake -S . -B build/ci-windows -G Ninja
          -DLVGL_APP=device-dashboard -DLVGL_TARGET=pc-sdl2 -DLVGL_SERIES=9
      - run: cmake --build build/ci-windows
      - run: ctest --test-dir build/ci-windows --output-on-failure

  linux-fbdev-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build
      - run: >-
          cmake -S . -B build/ci-linux -G Ninja
          -DLVGL_APP=device-dashboard -DLVGL_TARGET=linux-fbdev-evdev -DLVGL_SERIES=9
      - run: cmake --build build/ci-linux
      - run: ctest --test-dir build/ci-linux --output-on-failure
